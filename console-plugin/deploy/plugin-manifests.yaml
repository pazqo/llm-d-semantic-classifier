---
apiVersion: v1
kind: Namespace
metadata:
  name: llm-d-sc-plugin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-sc-console-plugin
  namespace: llm-d-sc-plugin
  labels:
    app: llm-d-sc-console-plugin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-sc-console-plugin
  template:
    metadata:
      labels:
        app: llm-d-sc-console-plugin
    spec:
      containers:
        - name: plugin
          image: image-registry.openshift-image-registry.svc:5000/llm-d-sc-plugin/llm-d-sc-console-plugin:latest
          ports:
            - containerPort: 9443
              protocol: TCP
          volumeMounts:
            - name: serving-cert
              readOnly: true
              mountPath: /var/serving-cert
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: serving-cert
          secret:
            secretName: llm-d-sc-console-plugin-cert
            defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: llm-d-sc-console-plugin
  namespace: llm-d-sc-plugin
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: llm-d-sc-console-plugin-cert
  labels:
    app: llm-d-sc-console-plugin
spec:
  ports:
    - name: 9443-tcp
      protocol: TCP
      port: 9443
      targetPort: 9443
  selector:
    app: llm-d-sc-console-plugin
  type: ClusterIP
---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: llm-d-sc-console-plugin
spec:
  displayName: Semantic Classifier
  backend:
    type: Service
    service:
      name: llm-d-sc-console-plugin
      namespace: llm-d-sc-plugin
      port: 9443
      basePath: /
